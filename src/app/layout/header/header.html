<div class="prototype">Protótipo demonstrativo · Não realiza agendamentos oficiais</div>
<header>
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="APL Educa — início" (click)="menuOpen.set(false)">
      <span class="brand-title">APL <em>Educa</em></span>
      <span class="brand-caption">Visitas escolares</span>
    </a>
    <button
      #menuButton
      pButton
      type="button"
      class="menu-toggle"
      [outlined]="true"
      aria-controls="navegacao-principal"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      Menu
    </button>
    <nav
      id="navegacao-principal"
      aria-label="Navegação principal"
      [class.open]="menuOpen()"
      (keydown.escape)="menuOpen.set(false); menuButton.focus()"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
          >{{ link.label }}</a
        >
      }
    </nav>
  </div>
</header>
